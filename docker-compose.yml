services:
  postgres:
    image: postgres:16-alpine
    container_name: mercury-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mercury_db}
      APP_DB_USER: ${APP_DB_USER:-mercury_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-mercury_app_secret}
      ML_DB_USER: ${ML_DB_USER:-mercury_ml}
      ML_DB_PASSWORD: ${ML_DB_PASSWORD:-mercury_ml_secret}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mercury_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-mercury_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-engine:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    container_name: mercury-ml-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${ML_DB_USER:-mercury_ml}:${ML_DB_PASSWORD:-mercury_ml_secret}@postgres:5432/${POSTGRES_DB:-mercury_db}
      ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${ML_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mercury-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${APP_DB_USER:-mercury_app}:${APP_DB_PASSWORD:-mercury_app_secret}@postgres:5432/${POSTGRES_DB:-mercury_db}
      ML_ENGINE_URL: http://ml-engine:8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      ml-engine:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: mercury-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mercury_pgdata:

